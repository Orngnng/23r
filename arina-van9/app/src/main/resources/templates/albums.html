<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Коллекция музыкальных альбомов</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }
        h1 {
            margin: 0;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .filter-section {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .filter-section select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .btn {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .btn-danger {
            background-color: #dc3545;
        }
        .btn-danger:hover {
            background-color: #c82333;
        }
        .btn-secondary {
            background-color: #6c757d;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f8f9fa;
            font-weight: bold;
        }
        .actions {
            display: flex;
            gap: 5px;
        }
        .empty-message {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <header>
        <h1>Коллекция музыкальных альбомов</h1>
        <div class="user-info">
            <span>Пользователь: <strong th:text="${userLogin}"></strong></span>
            <a th:href="@{/logout}" class="btn btn-secondary">Выйти</a>
        </div>
    </header>
    
    <div class="filter-section">
        <a th:href="@{/albums/add}" class="btn">Добавить альбом</a>
        
        <form th:action="@{/albums}" method="get" style="display: flex; gap: 10px; margin-left: auto;">
            <select name="genre" onchange="this.form.submit()">
                <option value="">Все жанры</option>
                <option th:each="g : ${genres}" 
                        th:value="${g}" 
                        th:text="${g}"
                        th:selected="${g == selectedGenre}">
                </option>
            </select>
            <button type="submit" class="btn">Фильтровать</button>
            <a th:href="@{/albums}" class="btn btn-secondary">Сбросить</a>
        </form>
    </div>
    
    <div th:if="${albums.isEmpty()}" class="empty-message">
        <p>У вас пока нет альбомов в коллекции.</p>
        <a th:href="@{/albums/add}" class="btn">Добавить первый альбом</a>
    </div>
    
    <table th:if="${!albums.isEmpty()}">
        <thead>
            <tr>
                <th>Название</th>
                <th>Исполнитель</th>
                <th>Год</th>
                <th>Жанр</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="album : ${albums}">
                <td th:text="${album.title}"></td>
                <td th:text="${album.artist}"></td>
                <td th:text="${album.year}"></td>
                <td th:text="${album.genre}"></td>
                <td>
                    <div class="actions">
                        <a th:href="@{/albums/edit/{id}(id=${album.id})}" class="btn">Изменить</a>
                        <form th:action="@{/albums/delete/{id}(id=${album.id})}" method="post" style="display: inline;">
                            <button type="submit" class="btn btn-danger" onclick="return confirm('Удалить этот альбом?')">Удалить</button>
                        </form>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
