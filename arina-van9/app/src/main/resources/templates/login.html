<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 10px;
            font-weight: bold;
        }
        input {
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            margin-top: 20px;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .error {
            color: red;
            text-align: center;
            margin-bottom: 10px;
        }
        .success {
            color: green;
            text-align: center;
            margin-bottom: 10px;
        }
        .link {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Вход</h1>
    
    <div th:if="${param.registered}" class="success">
        <p>Регистрация успешна! Войдите в систему.</p>
    </div>
    
    <div th:if="${param.logout}" class="success">
        <p>Вы успешно вышли из системы.</p>
    </div>
    
    <div th:if="${error}" class="error">
        <p th:text="${error}"></p>
    </div>
    
    <form th:action="@{/login}" th:object="${user}" method="post">
        <label for="login">Логин:</label>
        <input type="text" id="login" th:field="*{login}" required>
        
        <label for="password">Пароль:</label>
        <input type="password" id="password" th:field="*{password}" required>
        
        <button type="submit">Войти</button>
    </form>
    
    <div class="link">
        <p>Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a></p>
    </div>
</body>
</html>
