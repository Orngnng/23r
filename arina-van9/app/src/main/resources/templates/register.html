<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 10px;
            font-weight: bold;
        }
        input {
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            margin-top: 20px;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error {
            color: red;
            font-size: 14px;
            margin-top: 5px;
        }
        .link {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Регистрация</h1>
    
    <div th:if="${error}" class="error" style="text-align: center; margin-bottom: 10px;">
        <p th:text="${error}"></p>
    </div>
    
    <form th:action="@{/register}" th:object="${user}" method="post">
        <label for="login">Логин:</label>
        <input type="text" id="login" th:field="*{login}" required>
        <div th:if="${#fields.hasErrors('login')}" class="error">
            <p th:each="err : ${#fields.errors('login')}" th:text="${err}"></p>
        </div>
        
        <label for="password">Пароль:</label>
        <input type="password" id="password" th:field="*{password}" required>
        <div th:if="${#fields.hasErrors('password')}" class="error">
            <p th:each="err : ${#fields.errors('password')}" th:text="${err}"></p>
        </div>
        
        <button type="submit">Зарегистрироваться</button>
    </form>
    
    <div class="link">
        <p>Уже есть аккаунт? <a th:href="@{/login}">Войти</a></p>
    </div>
</body>
</html>
